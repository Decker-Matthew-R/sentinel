syntax = "proto3";

package sentinel.v1;

option csharp_namespace = "Sentinel.V1";

message Envelope {
  uint32 version = 1;
  oneof payload {
    Hello hello = 2;
    Heartbeat heartbeat = 3;
    MetricsSnapshot metrics_snapshot = 4;
    Specs specs = 5;
  }
}

message Hello {
  string agent_version = 1;
}

message Heartbeat {}

message MetricsSnapshot {
  uint64 uptime_seconds = 1;
  CpuMetrics cpu = 2;
  GpuMetrics gpu = 3;
  RamMetrics ram = 4;
}

message CpuMetrics {
  float utilization = 1;
  float temperature = 2;
}

message GpuMetrics {
  float utilization = 1;
  float temperature = 2;
  float hotspot_temperature = 3;
  uint64 vram_used_mb = 4;
  uint64 vram_total_mb = 5;
}

message RamMetrics {
  uint64 used_mb = 1;
  uint64 total_mb = 2;
}

message Specs {
  string cpu_name = 1;
  string gpu_name = 2;
  uint64 ram_total_mb = 3;
  string os_version = 4;
  uint32 cpu_core_count = 5;
  uint32 cpu_thread_count = 6;
  uint32 cpu_boost_clock_mhz = 7;
  uint64 gpu_vram_total_mb = 8;
  uint32 ram_speed_mhz = 9;
  string ram_name = 10;
}