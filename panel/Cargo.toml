[package]
name = "sentinel-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1"
prost = "0.13"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
slint = { version = "1", features = ["system-testing"] }
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1"
prost-build = "0.13"