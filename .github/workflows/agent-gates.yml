name: Run Agent Gates

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-gates.yml'
  pull_request:

jobs:
  agent-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Format .NET
        run: dotnet format --verify-no-changes agent/

      - name: CVE Scan
        run: dotnet list agent/ package --vulnerable --include-transitive

      - name: Build
        run: dotnet build agent/

      - name: Test
        run: dotnet test agent/ --no-build
