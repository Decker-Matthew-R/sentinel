name: Run Panel Gates

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/panel-gates.yml'
  pull_request:

permissions:
  contents: read

jobs:
  panel-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Slint System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libegl-dev protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: CVE Scan
        run: cargo audit --file panel/Cargo.lock

      - name: Format Rust
        run: cargo fmt --manifest-path panel/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path panel/Cargo.toml -- -D warnings
        
      - name: Build
        run: cargo build --manifest-path panel/Cargo.toml

      - name: Test
        run: cargo test --manifest-path panel/Cargo.toml

  panel-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Android NDK r27c
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel

      - name: Add aarch64-linux-android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build for Android
        run: cargo ndk -t arm64-v8a build
        working-directory: panel

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-panel-android
          path: panel/target/aarch64-linux-android/debug/sentinel-panel
