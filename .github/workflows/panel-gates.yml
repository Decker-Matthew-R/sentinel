name: Run Panel Gates

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/panel-gates.yml'
  pull_request:

permissions:
  contents: read

jobs:
  panel-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Slint System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libegl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: CVE Scan
        run: cargo audit --file panel/Cargo.lock

      - name: Format Rust
        run: cargo fmt --manifest-path panel/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path panel/Cargo.toml -- -D warnings
        
      - name: Build
        run: cargo build --manifest-path panel/Cargo.toml

      - name: Test
        run: cargo test --manifest-path panel/Cargo.toml
